name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install package and dev dependencies
        run: python -m pip install ".[dev]"
      - name: Import smoke test
        run: |
          cd /tmp
          python -c "import empirical_contracts, spatial_foundation, fcv_empirical; print(fcv_empirical.__file__)"
      - name: Tests
        run: python -m pytest
      - name: Ruff
        run: python -m ruff check src tests
